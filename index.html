<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0d12">
<title>BTC 15m — Kalshi Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body{ margin:0; height:100%; background:#0a0d12; overscroll-behavior:none; -webkit-text-size-adjust:100%; }
  :root{
    --bg:#0a0d12;
    --panel:#10151d;
    --line:#1c2530;
    --text:#e8edf4;
    --dim:#6b7686;
    --up:#26a690;
    --up-soft:rgba(38,166,144,.85);
    --down:#e0455f;
    --down-soft:rgba(224,69,95,.85);
    --poc:#f0c94a;
    --accent:#4a90e0;
    --gold:#c9a227;
    --gold-dim:rgba(201,162,39,.08);
  }
  *{box-sizing:border-box;}
  .btcv-root{
    background:var(--bg);
    color:var(--text);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    overflow:hidden;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .btcv-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), var(--bg));
  }
  .btcv-price-wrap{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .btcv-symbol{font-size:12px; letter-spacing:.12em; color:var(--dim);}
  .btcv-price{font-size:28px; font-weight:600; font-variant-numeric:tabular-nums;}
  .btcv-chg{font-size:14px; font-variant-numeric:tabular-nums;}
  .btcv-chg.up{color:var(--up);}
  .btcv-chg.down{color:var(--down);}
  .btcv-meta{display:flex; gap:20px; font-size:12px; color:var(--dim); align-items:center; flex-wrap:wrap;}
  .btcv-meta b{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums;}
  .btcv-dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px;}
  .btcv-dot.live{background:var(--up); box-shadow:0 0 8px var(--up);}
  .btcv-dot.off{background:var(--down);}

  .btcv-controls{display:flex; gap:8px; flex-wrap:wrap;}
  .btcv-btn{
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--text);
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:10px 15px; cursor:pointer; min-height:40px; white-space:nowrap;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .btcv-btn:active{transform:scale(.97);}
  .btcv-btn.active{border-color:var(--up); color:var(--up); background:rgba(38,166,144,0.12);}
  .btcv-btn:disabled{opacity:.4; cursor:not-allowed;}

  .btcv-reasons{font-size:11.5px; color:var(--dim); display:flex; flex-direction:column; gap:7px;}
  .btcv-reasons span b{color:var(--text);}

  .btcv-main{flex:1; display:flex; min-height:0;}
  .btcv-chart-col{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0;}
  .btcv-body{position:relative; flex:1; min-height:360px; touch-action:none;}
  .btcv-canvas{display:block; width:100%; height:100%; touch-action:none;}

  .btcv-zoomctl{
    position:absolute; top:10px; right:10px; display:flex; gap:6px; z-index:5;
  }
  .btcv-zbtn{
    font-family:inherit; font-size:15px; font-weight:700; color:var(--text);
    background:rgba(16,21,29,0.88); border:1px solid var(--line); border-radius:8px;
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
    backdrop-filter:blur(4px);
  }
  .btcv-zbtn:active{transform:scale(.94);}
  .btcv-zbtn.live-badge{width:auto; padding:0 10px; font-size:10.5px; letter-spacing:.05em;}
  .btcv-zbtn.live-badge.on{color:var(--up); border-color:var(--up);}
  .btcv-zbtn.live-badge.off{color:var(--gold); border-color:var(--gold);}

  .btcv-foot{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    padding:10px 18px;
    border-top:1px solid var(--line); font-size:11px; color:var(--dim);
    background:var(--panel);
  }
  .btcv-foot b{color:var(--text);}
  .btcv-legend{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
  .btcv-sw{width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:5px;}

  .btcv-side{
    width:320px; flex-shrink:0; display:flex; flex-direction:column;
    border-left:1px solid var(--line); background:var(--panel); overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .btcv-round-card{border-bottom:1px solid var(--line);}

  .btcv-hero{padding:18px 20px; transition:background .3s ease;}
  .btcv-hero-label{
    font-family:'Space Grotesk', ui-monospace, sans-serif;
    font-size:10px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--dim); margin-bottom:9px;
  }
  .btcv-hero-value{
    font-family:'Space Grotesk', ui-monospace, sans-serif;
    font-size:30px; font-weight:700; letter-spacing:-.01em; line-height:1.08;
  }
  .btcv-hero-sub{
    margin-top:9px; font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:12px; color:var(--dim); line-height:1.5;
  }
  .btcv-hero-sub b{color:var(--text);}
  .btcv-hero.state-scanning{background:var(--gold-dim);}
  .btcv-hero.state-locked-up{background:rgba(38,166,144,.10);}
  .btcv-hero.state-locked-down{background:rgba(224,69,95,.10);}
  .btcv-hero.state-skip{background:rgba(107,118,134,.08);}
  .tone-up{color:var(--up) !important;}
  .tone-down{color:var(--down) !important;}
  .tone-gold{color:var(--gold) !important;}
  .tone-muted{color:var(--dim) !important;}

  .btcv-conf-row{padding:0 20px 16px;}
  .btcv-conf-bar{height:5px; border-radius:3px; background:rgba(255,255,255,0.07); overflow:hidden;}
  .btcv-conf-fill{height:100%; width:0%; background:var(--accent); transition:width .35s ease;}
  .btcv-round-card .btcv-reasons{padding:0 20px 18px;}
  .btcv-freeze-note{
    margin:0 20px 16px; padding:8px 10px; font-size:10.5px; color:var(--dim);
    border:1px dashed var(--line); border-radius:7px; line-height:1.4;
  }

  .btcv-winrate-card{padding:18px 20px;}

  .btcv-kalshi-card{padding:18px 20px; border-top:1px solid var(--line);}
